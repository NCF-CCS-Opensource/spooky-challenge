# Challenge seed payloads are data; repeated SQL wrappers are not duplicated implementation.
sonar.cpd.exclusions=apps/api/db/seed.sql

# The all-in-one Piston/PostgreSQL image needs root to initialize both services.
sonar.issue.ignore.multicriteria=root_image
sonar.issue.ignore.multicriteria.root_image.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.root_image.resourceKey=**/Dockerfile
