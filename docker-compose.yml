services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: ${API_URL:-http://api:3001}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://treat_or_code:change-me@db:5432/treat_or_code}
      PISTON_URL: http://piston:2000
      PISTON_PYTHON_VERSION: ${PISTON_PYTHON_VERSION:-3.12.0}
    depends_on:
      db: { condition: service_healthy }
      piston: { condition: service_healthy }
    networks: [app, data, runner]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-treat_or_code}
      POSTGRES_USER: ${POSTGRES_USER:-treat_or_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./apps/api/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    tmpfs: [/tmp:exec]
    volumes: [piston-packages:/piston/packages]
    networks: [runner]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  piston-packages:

networks:
  app:
  data:
    internal: true
  runner:
    internal: true
